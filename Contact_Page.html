         <p>
            <label for="fname">First Name</label><br>
            <input type="text" id="fname" name="Fname" size="32">
        </p>    
        <p>

        <p>
            <label for="Phone_Numb">Phone No.</label><br>
            <input type="tel" id="Phone" name="Phone" size="32" autocomplete="tel" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
        </p>
        <p>
            <label for="comments">Comments</label><br> <!--Made sure that the comments section is a text area not a label-->

        </p>
